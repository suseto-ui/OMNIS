# SonarQube Project Configuration & Quality Gate Rules
# O.M.N.I.S. Decarbonized Codebase & Quality Gate

sonar.projectKey=omnis-cognitive-platform
sonar.projectName=O.M.N.I.S. Cognitive Platform
sonar.projectVersion=2026.1.0

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug

# Language Settings
sonar.language=kotlin
sonar.sourceEncoding=UTF-8

# Strict Quality Gate Thresholds (Prevent Dead Code & High Duplication)
sonar.qualitygate.conditions.duplicated_lines_density.error=3.0
sonar.qualitygate.conditions.coverage.error=80.0
sonar.qualitygate.conditions.cognitive_complexity.error=15
sonar.qualitygate.conditions.blocker_violations.error=0
sonar.qualitygate.conditions.critical_violations.error=0
sonar.qualitygate.conditions.security_rating.error=1

# Exclusions for Generated Code
sonar.exclusions=**/build/**,**/R.java,**/BuildConfig.java
