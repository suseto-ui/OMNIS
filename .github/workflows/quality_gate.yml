name: O.M.N.I.S. Quality Gate & Decarbonization Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality_gate_and_decarbonization_check:
    name: Run Quality Gate & Dead Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Unit Tests & Coverage Verification
        run: gradle testDebugUnitTest --no-daemon

      - name: Execute Quality Gate Enforcement Script
        run: python3 verify_quality_gate.py

      - name: SonarQube Scan & Quality Gate Status
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
