name: Deploy Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK with Gradle & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Package
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/Omnis-install.apk
            echo "APK ready at build-artifacts/Omnis-install.apk"
          else
            echo "ERROR: APK file not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omnis-install-apk
          path: build-artifacts/Omnis-install.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "O.M.N.I.S. Production Build (v1.0)"
          body: |
            ### 🚀 O.M.N.I.S. Android APK Release
            Automaticky sestavený a verifikovaný balíček při pushi do větve `main`.
            
            - **Balíček:** `Omnis-install.apk`
            - **Commit SHA:** `${{ github.sha }}`
            - **Čas kompilace:** `${{ github.event.head_commit.timestamp }}`
            
            #### 📲 Instalace do mobilu:
            Stáhněte přiložený soubor `Omnis-install.apk` do svého telefonu a spusťte instalaci.
          files: build-artifacts/Omnis-install.apk
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
